name: Build mod jar

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build RealisticGrowth
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Build jar
        run: gradle --no-daemon build

      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: RealisticGrowth-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
